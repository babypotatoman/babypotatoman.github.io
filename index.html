<style>
  :root {
    --bg: #F2F4F8; --surface: #FFFFFF; --fg: #16224A; --muted: #5A6482;
    --navy: #1E3584; --navy-fg: #FFFFFF; --orange: #E8961E; --line: #D9DEEA;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px; line-height: 1.55;
  }
  .wrap {
    max-width: 560px; margin: 0 auto;
    padding-top: calc(env(safe-area-inset-top, 0px) + 24px);
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 40px);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 18px;
  }
  .card {
    display: block; width: 100%; height: auto; border-radius: 10px; background: #fff;
    box-shadow: 0 1px 2px rgba(22,34,74,.10), 0 14px 34px -14px rgba(22,34,74,.40);
    -webkit-touch-callout: default;
  }
  .hint { margin: 0; text-align: center; font-size: 13px; color: var(--muted); }
  .save {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    min-height: 54px; border-radius: 12px; text-decoration: none;
    background: var(--navy); color: var(--navy-fg); font-weight: 600; font-size: 17px;
  }
  .save::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--orange); }
  .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .grid a {
    display: flex; align-items: center; justify-content: center; min-height: 46px;
    border-radius: 10px; background: var(--surface); border: 1px solid var(--line);
    color: var(--fg); text-decoration: none; font-weight: 500; font-size: 14px;
  }
  a:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
  .info {
    background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 14px;
  }
  .info dt { color: var(--muted); }
  .info dd { margin: 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
  .info a { color: var(--navy); }
  footer { text-align: center; font-size: 12px; color: var(--muted); }
</style>
